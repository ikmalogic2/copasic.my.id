<!DOCTYPE html>

</head>
<body class="flex h-screen overflow-hidden bg-[#F2F2F7] dark:bg-gray-900 transition-colors duration-300">

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden transition-opacity opacity-0" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-30 w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col shadow-xl lg:shadow-none">
        <div class="h-14 flex items-center px-5 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 shrink-0">

        </div>

    </aside>

    <main class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">

            <div class="flex items-center">
                <button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 flex items-center justify-center text-gray-600 dark:text-gray-300 mr-2 active:scale-95 transition-transform"><i class="fa-solid fa-bars text-lg"></i></button>
                <h1 class="text-[17px] font-bold text-gray-800 dark:text-white tracking-tight lg:hidden">copasic.my.id</h1>
            </div>
            <div class="flex items-center space-x-1 sm:space-x-3 ml-auto">
                <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                <button onclick="document.getElementById('import-file').click()" class="flex flex-col items-center justify-center w-10 h-10 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg active:scale-95 transition-all">
                    <i class="fa-solid fa-cloud-arrow-up text-[15px]"></i><span class="text-[9px] font-bold mt-0.5 tracking-wider">IMPORT</span>
                </button>
                <button onclick="exportData()" class="flex flex-col items-center justify-center w-10 h-10 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg active:scale-95 transition-all">
                    <i class="fa-solid fa-cloud-arrow-down text-[15px]"></i><span class="text-[9px] font-bold mt-0.5 tracking-wider">EXPORT</span>
                </button>
                <div class="w-px h-6 bg-gray-300 dark:bg-gray-700 mx-1"></div>
                <button onclick="toggleTheme()" id="btn-theme" class="w-10 h-10 flex items-center justify-center text-yellow-500 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 active:scale-95 transition-all"><i class="fa-solid fa-sun text-lg" id="theme-icon"></i></button>
                <button onclick="toggleGroupView()" id="btn-group" class="w-10 h-10 flex items-center justify-center text-indigo-500 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 active:scale-95 transition-all"><i class="fa-solid fa-layer-group text-lg"></i></button>
                <button onclick="openModal()" class="w-10 h-10 flex items-center justify-center text-blue-600 dark:text-blue-400 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/30 active:scale-95 transition-all"><i class="fa-solid fa-circle-plus text-2xl"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto pt-6 pb-10 px-4 lg:px-6 hide-scrollbar" id="main-area">
            <div id="notes-container" class="w-full max-w-[1600px] mx-auto"></div>
        </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 bg-black/50 dark:bg-black/70 z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeModal()"></div>
    <div id="modal" class="fixed inset-x-0 bottom-0 z-50 bg-white dark:bg-gray-800 rounded-t-3xl h-[85vh] md:max-w-2xl md:mx-auto shadow-2xl modal-enter flex flex-col transition-colors">
        <div class="flex justify-between items-center px-5 py-4 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-t-3xl shrink-0">
            <button onclick="closeModal()" class="text-gray-500 dark:text-gray-400 font-medium">Batal</button>
            <h2 class="font-semibold text-[17px] text-gray-800 dark:text-white" id="modal-title">Buat Catatan</h2>
            <button onclick="saveNote()" class="text-blue-600 dark:text-blue-400 font-bold">Simpan</button>
        </div>
        <div class="p-5 flex-1 overflow-y-auto hide-scrollbar bg-white dark:bg-gray-800">
            <input type="hidden" id="note-id">
            
            <div class="mb-4" id="category-select-container">
                <label class="block text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase mb-1">Pilih Kategori</label>
                <div class="relative">
                    <select id="note-category" onchange="toggleInputFields()" class="w-full appearance-none bg-gray-100 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-200 py-3 px-4 rounded-xl font-medium focus:outline-none"></select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500"><i class="fa-solid fa-chevron-down text-sm"></i></div>
                </div>
            </div>

            <div class="mb-4">
                <input type="text" id="note-title" placeholder="Judul Catatan..." class="w-full text-[20px] font-bold focus:outline-none text-black dark:text-white bg-transparent placeholder-gray-300 py-2 border-b border-gray-100 dark:border-gray-700">
            </div>

            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Lampiran (>2MB Auto Kompres)</label>
                <div class="flex space-x-2 mb-2">
                    <button onclick="document.getElementById('attach-image').click()" class="bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-gray-700 dark:text-gray-200 px-3 py-2 rounded-lg text-sm font-medium"><i class="fa-solid fa-image text-blue-500 mr-1"></i> Gambar</button>
                    <button onclick="document.getElementById('attach-file').click()" class="bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-gray-700 dark:text-gray-200 px-3 py-2 rounded-lg text-sm font-medium"><i class="fa-solid fa-paperclip text-purple-500 mr-1"></i> File</button>
                    <input type="file" id="attach-image" accept="image/*" class="hidden" onchange="handleFileUpload(event, 'image')" multiple>
                    <input type="file" id="attach-file" accept=".txt,.pdf,.html,.json,.doc,.docx,.xls,.xlsx,.csv" class="hidden" onchange="handleFileUpload(event, 'file')" multiple>
                </div>
                <div id="attachment-preview" class="flex flex-wrap gap-2"></div>
            </div>
            
            <div id="normal-input-container" class="w-full flex-col flex h-48">
                <textarea id="note-content" placeholder="Ketik isi catatan di sini..." class="w-full h-full text-[16px] focus:outline-none text-gray-700 dark:text-gray-200 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl border border-gray-100 dark:border-gray-600 resize-none"></textarea>
            </div>

            <div id="carousel-input-container" class="w-full flex-col hidden pb-5">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-xs font-semibold text-gray-400 uppercase">Isi Kartu Carousel</label>
                    <div class="flex items-center space-x-2 bg-gray-100 dark:bg-gray-700 rounded-lg p-1">
                        <button onclick="changeCarouselCount(-1)" class="w-7 h-7 text-gray-600 dark:text-gray-300 rounded hover:bg-gray-200"><i class="fa-solid fa-minus text-xs"></i></button>

                        <button onclick="changeCarouselCount(1)" class="w-7 h-7 text-gray-600 dark:text-gray-300 rounded hover:bg-gray-200"><i class="fa-solid fa-plus text-xs"></i></button>
                    </div>
                </div>
                <div id="carousel-cards-wrapper" class="space-y-3"></div>
            </div>
            
            <div id="mypassword-input-container" class="w-full flex-col hidden space-y-4 pb-5">
                <div><label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Username/Email</label><input type="text" id="pw-username" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-100 dark:border-gray-600 p-3 rounded-xl dark:text-white"></div>
                <div><label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label><input type="text" id="pw-password" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-100 dark:border-gray-600 p-3 rounded-xl font-mono dark:text-white"></div>
                <div><label class="block text-xs font-semibold text-gray-400 uppercase mb-1">URL</label><input type="url" id="pw-link" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-100 dark:border-gray-600 p-3 rounded-xl dark:text-white"></div>
            </div>

            <div id="revisi-input-container" class="w-full flex-col hidden space-y-4 pb-5">
                <div><label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Tujuan Revisi</label><input type="text" id="rev-tujuan" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-100 dark:border-gray-600 p-3 rounded-xl dark:text-white"></div>
                <div><label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Teks Utama</label><textarea id="rev-content" class="w-full h-40 bg-gray-50 dark:bg-gray-700 border border-gray-100 dark:border-gray-600 p-3 rounded-xl resize-none dark:text-white"></textarea></div>
            </div>

            <div id="oneshot-input-container" class="w-full flex-col hidden pb-5 items-center justify-center py-6">

                <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">Mode Anti-Distraksi</h3>
                <button onclick="openOneShotFullscreen()" class="bg-rose-500 hover:bg-rose-600 text-white px-8 py-3.5 rounded-2xl font-bold shadow-lg w-full md:w-auto"><i class="fa-solid fa-expand mr-2"></i> Buka Kanvas One Shot</button>
            </div>

    <div id="copy-modal-overlay" class="fixed inset-0 bg-black/50 z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div id="copy-modal-box" class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-sm shadow-2xl p-6 text-center transform scale-95 transition-transform duration-300">
            <div class="w-16 h-16 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center mx-auto mb-4 text-green-500"><i class="fa-regular fa-copy text-3xl"></i></div>
            <h3 class="text-lg font-bold dark:text-white mb-2">Salin Catatan</h3>

                <button onclick="executeCopy(true)" class="w-full py-3 bg-blue-500 text-white rounded-xl font-bold">Beserta Judul</button>
                <button onclick="executeCopy(false)" class="w-full py-3 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white rounded-xl font-bold">Tanpa Judul</button>

    <div id="delete-alert-overlay" class="fixed inset-0 bg-black/50 z-50 hidden opacity-0 flex items-center justify-center p-4 transition-opacity">
        <div id="delete-alert-box" class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-sm shadow-2xl p-6 text-center transform scale-95 transition-transform">
            <div class="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center mx-auto mb-4 text-red-500"><i class="fa-solid fa-triangle-exclamation text-3xl"></i></div>
            <h3 class="text-lg font-bold dark:text-white mb-2">Hapus Catatan?</h3>
            <div class="flex mt-6 gap-3">
                <button onclick="closeDeleteAlert()" class="flex-1 py-3 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl font-bold">Batal</button>
                <button onclick="confirmDelete()" class="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold">Hapus</button>

    <div id="oneshot-fullscreen-overlay" class="fixed inset-0 bg-[#F2F2F7] dark:bg-gray-900 z-[100] hidden flex-col opacity-0 transition-opacity duration-300">
        <div class="absolute top-6 left-6 right-6 flex justify-between items-center z-30 pointer-events-none">
            <div id="oneshot-fs-stats" class="text-sm font-bold text-rose-500 bg-rose-100 px-4 py-2 rounded-full shadow-sm pointer-events-auto">0 Kata</div>
            <button onclick="closeOneShotFullscreen()" class="w-12 h-12 bg-white dark:bg-gray-800 rounded-full shadow-lg flex items-center justify-center text-gray-800 dark:text-white pointer-events-auto hover:scale-105 transition"><i class="fa-solid fa-check text-xl"></i></button>
        </div>
        <textarea id="oneshot-fs-hidden" class="hidden"></textarea>
        <div class="flex-1 flex items-center justify-center p-8 relative overflow-hidden z-10">
            <div id="oneshot-fs-visible" contenteditable="true" autocapitalize="none" oninput="handleOneShotInput(event)" class="w-full max-w-5xl mx-auto text-center text-5xl md:text-[6vw] font-black text-gray-800 dark:text-gray-200 focus:outline-none empty:before:content-[attr(data-placeholder)] empty:before:text-gray-300 break-words" data-placeholder="Ketik di sini..."></div>
        </div>
        <div id="oneshot-fs-preview-box" class="absolute inset-x-6 top-24 bottom-28 md:inset-x-24 md:top-32 md:bottom-32 bg-white/95 dark:bg-gray-800/95 backdrop-blur rounded-3xl shadow-2xl p-8 hidden overflow-y-auto text-xl leading-relaxed text-gray-800 dark:text-gray-200 z-20"></div>
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-30 pointer-events-auto">
            <button onclick="toggleOneShotPreview()" id="btn-oneshot-preview" class="bg-gray-800 dark:bg-white text-white dark:text-gray-900 px-6 py-3 rounded-full font-bold shadow-xl flex items-center hover:scale-105"><i class="fa-solid fa-eye mr-2"></i> <span id="oneshot-preview-btn-text">Intip Teks</span></button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 dark:bg-white text-white px-5 py-3 rounded-xl shadow-xl transition-all duration-300 translate-y-20 opacity-0 z-[110] flex items-center pointer-events-none">
        <i class="fa-solid fa-check-circle text-green-400 mr-3"></i><span id="toast-message" class="text-[14px] font-medium">Sukses!</span>
    </div>

    <script>
        const categories = {
            carousel: { title: "Carousel Notes", icon: "🗂️", color: "text-pink-500", bg: "bg-pink-100 dark:bg-pink-900/30" },
            copas: { title: "Copas", icon: "📋", color: "text-green-500", bg: "bg-green-100 dark:bg-green-900/30" },
            efekfont: { title: "Efek Font", icon: "🔤", color: "text-emerald-500", bg: "bg-emerald-100 dark:bg-emerald-900/30" },
            error: { title: "Error Book", icon: "🐛", color: "text-red-500", bg: "bg-red-100 dark:bg-red-900/30" },
            ideation: { title: "Ideation", icon: "💡", color: "text-amber-500", bg: "bg-amber-100 dark:bg-amber-900/30" },
            myinstruction: { title: "Instruction", icon: "💻", color: "text-indigo-500", bg: "bg-indigo-100 dark:bg-indigo-900/30" },
            memo: { title: "Memo Tasks", icon: "📝", color: "text-yellow-500", bg: "bg-yellow-100 dark:bg-yellow-900/30" },
            mylink: { title: "My Link", icon: "🔗", color: "text-purple-500", bg: "bg-purple-100 dark:bg-purple-900/30" },
            mypassword: { title: "My Password", icon: "🔑", color: "text-teal-500", bg: "bg-teal-100 dark:bg-teal-900/30" },
            myprompt: { title: "My Prompt", icon: "⌨️", color: "text-orange-500", bg: "bg-orange-100 dark:bg-orange-900/30" },
            oneshot: { title: "One Shot", icon: "🎯", color: "text-rose-500", bg: "bg-rose-100 dark:bg-rose-900/30" },
            revisi: { title: "Revisi", icon: "🔄", color: "text-cyan-500", bg: "bg-cyan-100 dark:bg-cyan-900/30" },
            styleart: { title: "Style Art", icon: "🎨", color: "text-fuchsia-500", bg: "bg-fuchsia-100 dark:bg-fuchsia-900/30" }
        };
        const sortedCategoryKeys = Object.keys(categories).sort((a,b) => categories[a].title.localeCompare(categories[b].title));

        let notes = [];
        const STORAGE_KEY = "simple_app_notes";
        let currentFilter = 'all';
        let isGrouped = false; 
        let openNotes = new Set(), openCategories = new Set();
        let currentAttachments = [], currentCarouselImages = {}, currentCarouselCount = 3;
        let noteIdToDelete = null, noteIdToCopy = null, toastTimeout;

        window.onload = () => { initTheme(); populateCategorySelect(); loadNotes(); renderSidebar(); };

        function initTheme() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-moon text-lg";
                document.getElementById('btn-theme').classList.replace('text-yellow-500', 'text-gray-500');
            }
        }
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-moon text-lg";
                document.getElementById('btn-theme').classList.replace('text-yellow-500', 'text-gray-500');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-sun text-lg";
                document.getElementById('btn-theme').classList.replace('text-gray-500', 'text-yellow-500');
                localStorage.setItem('theme', 'dark');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function toggleSidebar() {
            const s = document.getElementById('sidebar'), o = document.getElementById('sidebar-overlay');
            if (s.classList.contains('-translate-x-full')) {
                s.classList.remove('-translate-x-full'); o.classList.remove('hidden'); setTimeout(() => o.classList.remove('opacity-0'), 10);
            } else {
                s.classList.add('-translate-x-full'); o.classList.add('opacity-0'); setTimeout(() => o.classList.add('hidden'), 300);
            }
        }

        function setFilter(key) { currentFilter = key; renderSidebar(); renderNotes(); if(window.innerWidth < 1024) toggleSidebar(); }

        function renderSidebar() {
            let h = `<button onclick="setFilter('all')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition-colors ${currentFilter === 'all' ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'}"><div class="flex items-center"><i class="fa-solid fa-border-all w-6 mr-2"></i> Semua Catatan</div><span class="bg-gray-200 dark:bg-gray-700 text-xs px-2 rounded-full">${notes.length}</span></button><div class="my-2 border-t border-gray-100 dark:border-gray-700"></div>`;
            sortedCategoryKeys.forEach(key => {
                const c = notes.filter(n => n.category === key).length;
                h += `<button onclick="setFilter('${key}')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition-colors ${currentFilter === key ? 'bg-gray-100 dark:bg-gray-700 font-bold dark:text-white' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'}"><div class="flex items-center"><span class="w-6 text-lg mr-2">${categories[key].icon}</span>${categories[key].title}</div>${c>0 ? `<span class="bg-gray-200 dark:bg-gray-700 text-xs px-2 rounded-full">${c}</span>` : ''}</button>`;
            });
            document.getElementById('sidebar-categories').innerHTML = h;
        }

        function populateCategorySelect() {
            const sel = document.getElementById('note-category'); sel.innerHTML = '';
            sortedCategoryKeys.forEach(k => {
                const o = document.createElement('option'); o.value = k; o.innerHTML = `${categories[k].icon} ${categories[k].title}`;
                if (k === 'copas') o.selected = true;
                sel.appendChild(o);
            });
        }

        function compressImage(file, cb) {
            const r = new FileReader();
            r.onload = (e) => {
                const img = new Image(); img.onload = () => {
                    const cvs = document.createElement('canvas'), ctx = cvs.getContext('2d');
                    let w = img.width, h = img.height;
                    if (w>h && w>1200) { h*=1200/w; w=1200; } else if (h>1200) { w*=1200/h; h=1200; }
                    cvs.width = w; cvs.height = h; ctx.drawImage(img,0,0,w,h); cb(cvs.toDataURL('image/jpeg', 0.8));
                }; img.src = e.target.result;
            }; r.readAsDataURL(file);
        }

        function handleFileUpload(evt, type) {
            Array.from(evt.target.files).forEach(f => {
                if (type === 'image' && f.size > 2097152) {
                    showToast(`Kompresi ${f.name}...`); compressImage(f, c => { currentAttachments.push({ id: Date.now()+Math.random(), type, name: f.name, data: c }); renderAttachmentPreview(); showToast("Kompresi sukses."); });
                } else if (type !== 'image' && f.size > 2097152) { showToast(`File maks 2MB.`); } 
                else {
                    const r = new FileReader(); r.onload = e => { currentAttachments.push({ id: Date.now()+Math.random(), type, name: f.name, data: e.target.result }); renderAttachmentPreview(); }; r.readAsDataURL(f);
                }
            }); evt.target.value = ''; 
        }

        function removeAttachment(id) { currentAttachments = currentAttachments.filter(a => a.id !== id); renderAttachmentPreview(); }

        function renderAttachmentPreview() {
            document.getElementById('attachment-preview').innerHTML = currentAttachments.map(a => a.type === 'image' ? `<div class="relative w-16 h-16 rounded-lg overflow-hidden border border-gray-200"><img src="${a.data}" class="object-cover w-full h-full"><button onclick="removeAttachment(${a.id})" class="absolute top-0 right-0 bg-red-500 text-white w-5 h-5 text-xs"><i class="fa-solid fa-times"></i></button></div>` : `<div class="relative bg-gray-50 px-3 py-2 rounded-lg text-xs"><i class="fa-solid fa-file mr-2"></i>${a.name}<button onclick="removeAttachment(${a.id})" class="absolute top-1 right-1 bg-red-500 text-white w-4 h-4 rounded-full text-[10px]"><i class="fa-solid fa-times"></i></button></div>`).join('');
        }

        function toggleInputFields() {
            const cat = document.getElementById('note-category').value;
            ['normal','carousel','mypassword','revisi','oneshot'].forEach(id => {
                const el = document.getElementById(id+'-input-container'); if(el) { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            const tg = document.getElementById(cat === 'carousel' || cat === 'mypassword' || cat === 'revisi' || cat === 'oneshot' ? cat+'-input-container' : 'normal-input-container');
            tg.classList.replace('hidden', 'flex');
        }

        function initCarouselInputs(count = 3) {
            currentCarouselCount = count; document.getElementById('carousel-count-display').innerText = count;
            const wrap = document.getElementById('carousel-cards-wrapper'); wrap.innerHTML = '';
            for(let i=1; i<=count; i++) wrap.innerHTML += createCarouselInputGroup(i, i);
            wrap.innerHTML += createCarouselInputGroup('caption', 'Caption');
        }

        function createCarouselInputGroup(id, lbl) {
            const bClass = id === 'caption' ? 'bg-purple-500 px-2' : 'bg-pink-500 w-6';
            return `<div class="relative bg-gray-50 dark:bg-gray-700 border border-gray-100 dark:border-gray-600 p-3 rounded-xl mt-3"><div class="absolute -top-2 -left-2 ${bClass} text-white h-6 flex items-center justify-center rounded-full text-[11px] font-bold">${lbl}</div><textarea id="car-content-${id}" class="w-full bg-transparent text-[15px] dark:text-white focus:outline-none resize-none h-16 pt-1"></textarea><div class="mt-2 pt-2 border-t flex justify-between"><button onclick="document.getElementById('modal-car-img-${id}').click()" class="text-[12px] text-blue-500"><i class="fa-solid fa-image"></i> Gambar</button><input type="file" id="modal-car-img-${id}" accept="image/*" class="hidden" onchange="handleModalCarouselImage(event, '${id}')"><div id="car-img-preview-box-${id}" class="hidden flex items-center space-x-2"><img id="car-img-preview-src-${id}" src="" class="w-8 h-8 object-cover rounded"><button onclick="removeModalCarouselImage('${id}')" class="text-red-500 text-[12px]"><i class="fa-solid fa-times"></i></button></div></div></div>`;
        }

        function handleModalCarouselImage(evt, idx) {
            const f = evt.target.files[0]; if(!f) return;
            if(f.size>2097152){ compressImage(f, c => { currentCarouselImages[idx]=c; renderModalCarouselImagePreview(idx); }); }
            else { const r = new FileReader(); r.onload=e=>{ currentCarouselImages[idx]=e.target.result; renderModalCarouselImagePreview(idx); }; r.readAsDataURL(f); }
        }
        function removeModalCarouselImage(idx) { delete currentCarouselImages[idx]; renderModalCarouselImagePreview(idx); }
        function renderModalCarouselImagePreview(idx) {
            const bx = document.getElementById(`car-img-preview-box-${idx}`), im = document.getElementById(`car-img-preview-src-${idx}`);
            if(currentCarouselImages[idx]){ im.src = currentCarouselImages[idx]; bx.classList.remove('hidden'); } else bx.classList.add('hidden');
        }

        function changeCarouselCount(d) {
            const n = currentCarouselCount + d; if (n<1 || n>20) return;
            const w = document.getElementById('carousel-cards-wrapper'), cap = document.getElementById('car-input-group-caption');
            if (d>0) { currentCarouselCount++; const p = document.createElement('div'); p.innerHTML = createCarouselInputGroup(currentCarouselCount, currentCarouselCount); w.insertBefore(p.firstElementChild, cap); }
            else { const c = document.getElementById(`car-input-group-${currentCarouselCount}`); if(c) c.remove(); delete currentCarouselImages[currentCarouselCount]; currentCarouselCount--; }
            document.getElementById('carousel-count-display').innerText = currentCarouselCount;
        }

        function openModal(editId = null) {
            ['note-id','note-title','note-content','pw-username','pw-password','pw-link','rev-tujuan','rev-content','oneshot-fs-hidden'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = ""; });
            if(document.getElementById('oneshot-fs-visible')) document.getElementById('oneshot-fs-visible').innerText = "";
            const catC = document.getElementById('category-select-container'), catS = document.getElementById('note-category');
            
            if (editId) {
                catC.classList.remove('hidden'); const note = notes.find(n => n.id === editId);
                if(note) {
                    document.getElementById('note-id').value = note.id; document.getElementById('note-title').value = note.title; catS.value = note.category;
                    currentAttachments = note.attachments ? [...note.attachments] : [];
                    let cCount = 3;
                    if(note.category==='carousel'){
                        let p = []; try{ p=JSON.parse(note.content); }catch(e){}
                        const reg = p.filter(c=>!c.isCaption), cap = p.find(c=>c.isCaption);
                        if(reg.length>0) cCount = reg.length; initCarouselInputs(cCount);
                        for(let i=1;i<=cCount;i++){ if(reg[i-1]){ document.getElementById(`car-content-${i}`).value=reg[i-1].content||''; if(reg[i-1].image){ currentCarouselImages[i]=reg[i-1].image; renderModalCarouselImagePreview(i); } } }
                        if(cap){ document.getElementById('car-content-caption').value=cap.content||''; if(cap.image){ currentCarouselImages['caption']=cap.image; renderModalCarouselImagePreview('caption'); } }
                    } else if(note.category==='mypassword'){
                        let p = {}; try{ p=JSON.parse(note.content); }catch(e){}
                        document.getElementById('pw-username').value=p.username||''; document.getElementById('pw-password').value=p.password||''; document.getElementById('pw-link').value=p.link||''; initCarouselInputs();
                    } else if(note.category==='revisi'){
                        let r = {}; try{ r=JSON.parse(note.content); }catch(e){}
                        document.getElementById('rev-tujuan').value=r.tujuan||''; document.getElementById('rev-content').value=r.content||''; initCarouselInputs();
                    } else if(note.category==='oneshot'){ document.getElementById('oneshot-fs-hidden').value=note.content||''; updateOneShotStats(); initCarouselInputs(); }
                    else { document.getElementById('note-content').value=note.content; initCarouselInputs(); }
                }
            } else {
                currentAttachments=[]; currentCarouselImages={}; initCarouselInputs();
                if(currentFilter!=='all'){ catS.value=currentFilter; catC.classList.add('hidden'); } else { catC.classList.remove('hidden'); }
            }
            renderAttachmentPreview(); toggleInputFields();
            document.getElementById('modal-overlay').classList.remove('hidden'); setTimeout(()=> { document.getElementById('modal-overlay').classList.remove('opacity-0'); document.getElementById('modal').classList.add('modal-active'); }, 10);
        }

        function closeModal() { document.getElementById('modal-overlay').classList.add('opacity-0'); document.getElementById('modal').classList.remove('modal-active'); setTimeout(()=>document.getElementById('modal-overlay').classList.add('hidden'), 300); }

        function openOneShotFullscreen() {
            document.getElementById('oneshot-fullscreen-overlay').classList.remove('hidden'); document.getElementById('oneshot-fullscreen-overlay').classList.add('flex');
            setTimeout(() => { document.getElementById('oneshot-fullscreen-overlay').classList.remove('opacity-0'); placeCaretAtEnd(document.getElementById('oneshot-fs-visible')); }, 10);
        }
        function closeOneShotFullscreen() { document.getElementById('oneshot-fullscreen-overlay').classList.add('opacity-0'); setTimeout(() => { document.getElementById('oneshot-fullscreen-overlay').classList.add('hidden'); document.getElementById('oneshot-fullscreen-overlay').classList.remove('flex'); }, 300); }
        
        function handleOneShotInput(e) {
            const vis = document.getElementById('oneshot-fs-visible'), hid = document.getElementById('oneshot-fs-hidden');
            let txt = vis.innerText;
            
            if (txt.length === 1) {
                const prev = hid.value;
                if (prev === "" || /[.!?]\s+$/.test(prev)) { vis.innerText = txt.toUpperCase(); placeCaretAtEnd(vis); txt = vis.innerText; }
            }

            let val = txt.replace(/\u00A0/g, " ");
            if (val.includes(' ') || val.includes('\n')) {
                const m = val.match(/^(.*[\s\n]+)([^\s\n]*)$/);
                if (m) { hid.value += m[1]; vis.innerText = m[2]; placeCaretAtEnd(vis); }
            }
            updateOneShotStats();
            const box = document.getElementById('oneshot-fs-preview-box');
            if(!box.classList.contains('hidden')) box.innerText = hid.value + vis.innerText;
        }

        function placeCaretAtEnd(el) {
            el.focus(); if (typeof window.getSelection !== "undefined" && typeof document.createRange !== "undefined") {
                const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
                const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
            }
        }
        function updateOneShotStats() {
            const txt = document.getElementById('oneshot-fs-hidden').value + document.getElementById('oneshot-fs-visible').innerText;
            const w = txt.trim() === "" ? 0 : txt.trim().split(/\s+/).length;
            document.getElementById('oneshot-fs-stats').innerText = w + " Kata";
        }
        function toggleOneShotPreview() {
            const box = document.getElementById('oneshot-fs-preview-box'), btnTxt = document.getElementById('oneshot-preview-btn-text');
            if (box.classList.contains('hidden')) { box.classList.remove('hidden'); box.innerText = document.getElementById('oneshot-fs-hidden').value + document.getElementById('oneshot-fs-visible').innerText; btnTxt.innerText = "Tutup Intip"; } 
            else { box.classList.add('hidden'); btnTxt.innerText = "Intip Teks"; placeCaretAtEnd(document.getElementById('oneshot-fs-visible')); }
        }

        function saveNote() {
            const id = document.getElementById('note-id').value, cat = document.getElementById('note-category').value, title = document.getElementById('note-title').value.trim();
            let content = "";
            if (cat === 'carousel') {
                const cards = [];
                for(let i=1;i<=currentCarouselCount;i++){ cards.push({ id: `card-${Date.now()}-${i}`, content: document.getElementById(`car-content-${i}`).value, image: currentCarouselImages[i] || null, isCaption: false }); }
                cards.push({ id: `card-${Date.now()}-cap`, content: document.getElementById('car-content-caption').value, image: currentCarouselImages['caption'] || null, isCaption: true });
                content = JSON.stringify(cards);
            } else if (cat === 'mypassword') {
                content = JSON.stringify({ username: document.getElementById('pw-username').value, password: document.getElementById('pw-password').value, link: document.getElementById('pw-link').value });
            } else if (cat === 'revisi') {
                content = JSON.stringify({ tujuan: document.getElementById('rev-tujuan').value, content: document.getElementById('rev-content').value });
            } else if (cat === 'oneshot') { content = document.getElementById('oneshot-fs-hidden').value + document.getElementById('oneshot-fs-visible').innerText; } 
            else { content = document.getElementById('note-content').value; }

            if (!content.trim() && cat !== 'carousel' && cat !== 'mypassword' && cat !== 'revisi' && currentAttachments.length===0 && !title) {
                showToast("Catatan masih kosong!"); return;
            }

            if (id) { const i = notes.findIndex(n => n.id === id); if(i!==-1) notes[i] = { ...notes[i], category: cat, title, content, attachments: [...currentAttachments], updatedAt: new Date().toISOString() }; } 
            else { notes.unshift({ id: Date.now().toString(), category: cat, title, content, attachments: [...currentAttachments], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }); }
            
            saveToStorage(); renderSidebar(); renderNotes(); closeModal(); showToast("Tersimpan!");
        }

        function loadNotes() { const s = localStorage.getItem(STORAGE_KEY); if(s) notes = JSON.parse(s); renderNotes(); }
        function saveToStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }

        function toggleGroupView() { isGrouped = !isGrouped; document.getElementById('btn-group').classList.toggle('text-indigo-500'); document.getElementById('btn-group').classList.toggle('text-white'); document.getElementById('btn-group').classList.toggle('bg-indigo-500'); renderNotes(); }
        function toggleAccordion(id) { const c = document.getElementById(`acc-content-${id}`), i = document.getElementById(`acc-icon-${id}`); if(openNotes.has(id)){ openNotes.delete(id); c.classList.remove('open'); i.classList.remove('open'); } else { openNotes.add(id); c.classList.add('open'); i.classList.add('open'); } }
        function toggleCategoryGroup(cat) { const c = document.getElementById(`cat-content-${cat}`), i = document.getElementById(`cat-icon-${cat}`); if(openCategories.has(cat)){ openCategories.delete(cat); c.classList.add('hidden'); i.style.transform = 'rotate(0deg)'; } else { openCategories.add(cat); c.classList.remove('hidden'); i.style.transform = 'rotate(180deg)'; } }
        function formatDate(ds) { const d=new Date(ds), now=new Date(), diff=(now-d)/1000; if(diff<86400) return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); if(diff<604800) return ['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()]; return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'}); }

        function openCopyModal(id) { noteIdToCopy = id; document.getElementById('copy-modal-overlay').classList.remove('hidden'); setTimeout(()=>document.getElementById('copy-modal-overlay').classList.remove('opacity-0'),10); }
        function closeCopyModal() { document.getElementById('copy-modal-overlay').classList.add('opacity-0'); setTimeout(()=>document.getElementById('copy-modal-overlay').classList.add('hidden'),300); }
        
        function executeCopy(withTitle) {
            const n = notes.find(x => x.id === noteIdToCopy); if(!n) return;
            let txt = (withTitle && n.title) ? n.title + "\n\n" : "";
            if (n.category === 'carousel') {
                try { const p = JSON.parse(n.content); p.forEach((c,i)=>{ if(c.isCaption) txt+=`\n[CAPTION]\n${c.content}\n`; else txt+=`[Slide ${i+1}]\n${c.content}\n\n`; }); } catch(e){}
            } else if(n.category === 'mypassword') {
                try { const p=JSON.parse(n.content); txt+=`Username: ${p.username}\nPassword: ${p.password}\nLink: ${p.link}`; } catch(e){}
            } else if(n.category === 'revisi') {
                try { const r=JSON.parse(n.content); txt+=`Tujuan: ${r.tujuan}\nRevisi:\n${r.content}`; } catch(e){}
            } else { txt += n.content; }
            navigator.clipboard.writeText(txt.trim()).then(() => { closeCopyModal(); showToast("Disalin!"); });
        }

        function openDeleteAlert(id) { noteIdToDelete = id; document.getElementById('delete-alert-overlay').classList.remove('hidden'); setTimeout(()=>document.getElementById('delete-alert-overlay').classList.remove('opacity-0'),10); }
        function closeDeleteAlert() { document.getElementById('delete-alert-overlay').classList.add('opacity-0'); setTimeout(()=>document.getElementById('delete-alert-overlay').classList.add('hidden'),300); }
        function confirmDelete() { if(noteIdToDelete){ notes = notes.filter(n=>n.id!==noteIdToDelete); saveToStorage(); renderSidebar(); renderNotes(); closeDeleteAlert(); showToast("Dihapus!"); } }

        function renderNotes() {
            const cont = document.getElementById('notes-container'); cont.innerHTML = '';
            let f = notes; if(currentFilter!=='all') f = notes.filter(n=>n.category===currentFilter);
            if(f.length===0){ cont.innerHTML = `<div class="flex flex-col items-center justify-center h-64 text-gray-400"><i class="fa-solid fa-folder-open text-5xl mb-4 opacity-50"></i><p>Belum ada catatan.</p></div>`; return; }

            if (isGrouped) {
                const cats = [...new Set(f.map(n=>n.category))].sort();
                cats.forEach(c => {
                    const cNotes = f.filter(n=>n.category===c); const conf = categories[c]; if(!openCategories.has(c)) openCategories.add(c);
                    let h = `<div class="mb-6 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden"><div class="px-5 py-4 ${conf.bg} flex justify-between items-center cursor-pointer" onclick="toggleCategoryGroup('${c}')"><div class="flex items-center"><span class="text-2xl mr-3">${conf.icon}</span><h3 class="font-bold text-gray-800 dark:text-white">${conf.title} <span class="text-sm font-normal text-gray-500 ml-2">(${cNotes.length})</span></h3></div><i id="cat-icon-${c}" class="fa-solid fa-chevron-down text-gray-500 transition-transform ${openCategories.has(c)?'rotate-180':''}"></i></div><div id="cat-content-${c}" class="${openCategories.has(c)?'':'hidden'} p-4"><div class="columns-1 md:columns-2 lg:columns-3 gap-4 space-y-4">`;
                    cNotes.forEach(n => h += `<div class="break-inside-avoid">${buildNoteCard(n)}</div>`);
                    h += `</div></div></div>`; cont.innerHTML += h;
                });
            } else {
                let h = `<div class="columns-1 md:columns-2 xl:columns-3 gap-4 space-y-4">`;
                f.forEach(n => h += `<div class="break-inside-avoid">${buildNoteCard(n)}</div>`);
                h += `</div>`; cont.innerHTML = h;
            }
        }

        function buildNoteCard(note) {
            const conf = categories[note.category] || categories.copas;
            
            // Full Canvas Image layout
            let imgHtml = '', fileHtml = '';
            if(note.attachments && note.attachments.length>0){
                const imgs = note.attachments.filter(a=>a.type==='image'), fls = note.attachments.filter(a=>a.type!=='image');
                if(imgs.length>0) imgHtml = `<div class="w-full flex flex-col gap-2 mb-3">` + imgs.map(i=>`<img src="${i.data}" class="w-full h-auto object-cover rounded-xl border border-gray-100 dark:border-gray-700">`).join('') + `</div>`;
                if(fls.length>0) fileHtml = `<div class="flex flex-wrap gap-2 mt-4 pt-3 border-t border-gray-100 dark:border-gray-700">` + fls.map(f=>`<div class="bg-gray-50 dark:bg-gray-700 px-3 py-1.5 rounded-lg text-xs flex items-center dark:text-gray-300 border border-gray-100 dark:border-gray-600"><i class="fa-solid fa-file mr-2 text-gray-400"></i> <span class="truncate max-w-[120px]">${f.name}</span></div>`).join('') + `</div>`;
            }

            let cHtml = '';
            if (note.category === 'carousel') {
                try {
                    const p = JSON.parse(note.content), reg=p.filter(c=>!c.isCaption), cap=p.find(c=>c.isCaption);
                    if(reg.length>0) cHtml += `<div class="flex overflow-x-auto space-x-3 pb-2 hide-scrollbar">` + reg.map((c,i)=>`<div class="shrink-0 w-[200px] sm:w-[240px] bg-gray-50 dark:bg-gray-700 border border-gray-100 dark:border-gray-600 rounded-xl overflow-hidden flex flex-col"><div class="bg-pink-100 dark:bg-pink-900/30 px-3 py-1.5 text-[10px] font-bold text-pink-500 uppercase tracking-wider flex justify-between"><span>Slide ${i+1}</span></div>${c.image?`<img src="${c.image}" class="w-full h-24 object-cover border-b border-gray-100 dark:border-gray-600">`:''}<div class="p-3 text-sm dark:text-gray-200 whitespace-pre-wrap">${c.content}</div></div>`).join('') + `</div>`;
                    if(cap) cHtml += `<div class="mt-3 bg-purple-50 dark:bg-purple-900/10 border border-purple-100 dark:border-purple-900/30 rounded-xl overflow-hidden"><div class="bg-purple-100 dark:bg-purple-900/30 px-3 py-1.5 text-[10px] font-bold text-purple-600 uppercase">Caption</div>${cap.image?`<img src="${cap.image}" class="w-full h-32 object-cover">`:''}<div class="p-3 text-sm dark:text-gray-200 whitespace-pre-wrap">${cap.content}</div></div>`;
                } catch(e) { cHtml = note.content; }
            } else if (note.category === 'mypassword') {
                try {
                    const p = JSON.parse(note.content);
                    cHtml = `<div class="space-y-2"><div class="flex items-center text-sm"><span class="w-8 text-center text-gray-400"><i class="fa-solid fa-user"></i></span><span class="font-medium dark:text-white font-mono bg-gray-50 dark:bg-gray-700 px-2 py-1 rounded">${p.username||'-'}</span></div><div class="flex items-center text-sm"><span class="w-8 text-center text-gray-400"><i class="fa-solid fa-key"></i></span><span class="font-medium dark:text-white font-mono bg-gray-50 dark:bg-gray-700 px-2 py-1 rounded blur-sm hover:blur-none transition-all">${p.password||'-'}</span></div>${p.link?`<div class="flex items-center text-sm mt-2"><span class="w-8 text-center text-gray-400"><i class="fa-solid fa-link"></i></span><a href="${p.link}" target="_blank" class="text-blue-500 hover:underline truncate">${p.link}</a></div>`:''}</div>`;
                } catch(e) { cHtml = note.content; }
            } else if (note.category === 'revisi') {
                try { const r = JSON.parse(note.content); cHtml = `<div class="bg-cyan-50 dark:bg-cyan-900/10 border border-cyan-100 dark:border-cyan-900/30 p-3 rounded-xl mb-3"><div class="text-[10px] font-bold text-cyan-600 uppercase mb-1">Tujuan:</div><div class="font-medium dark:text-white">${r.tujuan}</div></div><div class="text-sm text-gray-700 dark:text-gray-300 whitespace-pre-wrap">${r.content}</div>`; } catch(e) { cHtml = note.content; }
            } else {
                let lines = note.content ? note.content.split('\n') : [];
                let pText = lines.slice(0, 3).join('\n');
                let isLong = lines.length > 3 || note.content.length > 200;
                if(isLong && lines.length <= 3) pText = note.content.substring(0,200) + '...';
                
                if (isLong) {
                    cHtml = `<div class="accordion-content ${openNotes.has(note.id)?'open':''}" id="acc-content-${note.id}"><div class="accordion-inner"><div class="text-[15px] leading-relaxed text-gray-700 dark:text-gray-200 whitespace-pre-wrap pb-2">${note.content}</div></div></div><div class="${openNotes.has(note.id)?'hidden':''} text-[15px] leading-relaxed text-gray-700 dark:text-gray-200 whitespace-pre-wrap relative">${pText}<div class="absolute bottom-0 w-full h-8 bg-gradient-to-t from-white dark:from-gray-800 to-transparent"></div></div><button onclick="toggleAccordion('${note.id}')" class="text-[12px] font-bold text-blue-500 mt-2 flex items-center hover:text-blue-600">Selengkapnya <i id="acc-icon-${note.id}" class="fa-solid fa-chevron-down ml-1 chevron-icon ${openNotes.has(note.id)?'open':''}"></i></button>`;
                } else { cHtml = `<div class="text-[15px] leading-relaxed text-gray-700 dark:text-gray-200 whitespace-pre-wrap">${note.content}</div>`; }
            }

            return `<div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-4 transition-all hover:shadow-md">
                <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center space-x-2"><span class="w-8 h-8 rounded-full ${conf.bg} ${conf.color} flex items-center justify-center text-sm shadow-sm">${conf.icon}</span>
                        <div>${note.title?`<h4 class="font-bold text-gray-900 dark:text-white text-base leading-tight">${note.title}</h4>`:''}<p class="text-[10px] text-gray-400 font-medium">${formatDate(note.createdAt)}</p></div>
                    </div>
                    <div class="flex space-x-1 opacity-60 hover:opacity-100 transition-opacity">
                        <button onclick="openCopyModal('${note.id}')" class="w-8 h-8 text-gray-400 hover:text-green-500 hover:bg-green-50 dark:hover:bg-green-900/30 rounded-lg flex items-center justify-center transition-colors"><i class="fa-regular fa-copy"></i></button>
                        <button onclick="openModal('${note.id}')" class="w-8 h-8 text-gray-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg flex items-center justify-center transition-colors"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="openDeleteAlert('${note.id}')" class="w-8 h-8 text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg flex items-center justify-center transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
                ${imgHtml}
                ${cHtml}
                ${fileHtml}
            </div>`;
        }

        function exportData() {
            const data = JSON.stringify(notes, null, 2); const blob = new Blob([data], {type: 'application/json'}); const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `copasic_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
            URL.revokeObjectURL(url); showToast("Data diexport!");
        }
        function importData(e) {
            const file = e.target.files[0]; if(!file) return; const reader = new FileReader();
            reader.onload = e => { try { const imp = JSON.parse(e.target.result); if(Array.isArray(imp)){ notes = [...imp, ...notes.filter(n=>!imp.find(i=>i.id===n.id))]; saveToStorage(); renderSidebar(); renderNotes(); showToast("Data diimport!"); } } catch(err) { showToast("File tidak valid"); } };
            reader.readAsText(file); e.target.value = '';
        }
    </script>
</body>
</html>
