<body class="flex h-screen overflow-hidden bg-ios-bg dark:bg-ios-darkBg transition-colors duration-300">

        <div class="h-14 flex items-center px-5 shrink-0 pt-2">

            <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">

        <!-- HEADER -->
        <header class="h-[52px] bg-ios-card/80 dark:bg-ios-darkBg/80 backdrop-blur-xl border-b border-ios-separator/30 dark:border-ios-darkSeparator flex items-center justify-between px-4 z-10 shrink-0 w-full relative">

                <button onclick="toggleGroupView()" id="btn-group" class="text-ios-blue text-[20px] active:opacity-50"><i class="fa-solid fa-layer-group"></i></button>

            </div>

        <!-- CONTENT LIST -->

    <!-- TOAST (iOS Top Notification) -->
    <div id="toast" class="fixed top-8 left-1/2 transform -translate-x-1/2 bg-white/80 dark:bg-[#2C2C2E]/80 backdrop-blur-xl border border-white/20 dark:border-white/10 px-5 py-3 rounded-full ios-shadow z-[110] flex items-center pointer-events-none toast-enter">
        <i class="fa-solid fa-circle-check text-green-500 mr-2 text-lg"></i>
        <span id="toast-message" class="text-[15px] font-medium text-black dark:text-white">Sukses!</span>
    </div>

    <!-- MODAL FORM (iOS Sheet) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/40 dark:bg-black/60 z-40 hidden opacity-0 transition-opacity duration-400" onclick="closeModal()"></div>
    <div id="modal" class="fixed inset-x-0 bottom-0 z-50 bg-ios-bg dark:bg-[#1C1C1E] rounded-t-[14px] h-[92vh] max-w-3xl mx-auto modal-enter flex flex-col ios-shadow">
        <!-- Grab Handle -->

        <!-- Sheet Header -->
        <div class="flex justify-between items-center px-4 py-2 border-b border-ios-separator/30 dark:border-ios-darkSeparator shrink-0">
            <button onclick="closeModal()" class="text-ios-blue text-[17px] font-normal active:opacity-50">Batal</button>

        <!-- Sheet Content -->

            <div class="mb-5" id="category-select-container">

            <div class="mb-5">

                    <button onclick="document.getElementById('attach-file').click()" class="bg-white dark:bg-[#2C2C2E] px-4 py-2 rounded-full text-[14px] font-medium text-black dark:text-white ios-shadow flex items-center active:scale-95 transition-transform"><i class="fa-solid fa-paperclip text-purple-500 mr-2"></i> File (>2MB Auto)</button>

            <div id="mypassword-input-container" class="w-full flex-col hidden space-y-4 pb-5">

    <!-- ONE SHOT KANVAS -->

        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-30 pointer-events-auto">
            <button onclick="toggleOneShotPreview()" id="btn-oneshot-preview" class="bg-black dark:bg-white text-white dark:text-black px-6 py-3 rounded-full font-semibold ios-shadow flex items-center active:opacity-70"><i class="fa-solid fa-eye mr-2"></i> <span id="oneshot-preview-btn-text">Intip Teks</span></button>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const categories = {
            carousel: { title: "Carousel Notes", icon: "🗂️", color: "text-pink-500", bg: "bg-pink-500" },
            copas: { title: "Copas", icon: "📋", color: "text-green-500", bg: "bg-green-500" },
            efekfont: { title: "Efek Font", icon: "🔤", color: "text-emerald-500", bg: "bg-emerald-500" },
            error: { title: "Error Book", icon: "🐛", color: "text-red-500", bg: "bg-red-500" },
            ideation: { title: "Ideation", icon: "💡", color: "text-yellow-500", bg: "bg-yellow-500" },
            myinstruction: { title: "Instruction", icon: "💻", color: "text-indigo-500", bg: "bg-indigo-500" },
            memo: { title: "Memo Tasks", icon: "📝", color: "text-orange-500", bg: "bg-orange-500" },
            mylink: { title: "My Link", icon: "🔗", color: "text-purple-500", bg: "bg-purple-500" },
            mypassword: { title: "My Password", icon: "🔑", color: "text-teal-500", bg: "bg-teal-500" },
            myprompt: { title: "My Prompt", icon: "⌨️", color: "text-cyan-500", bg: "bg-cyan-500" },
            oneshot: { title: "One Shot", icon: "🎯", color: "text-rose-500", bg: "bg-rose-500" },
            revisi: { title: "Revisi", icon: "🔄", color: "text-blue-500", bg: "bg-blue-500" },
            styleart: { title: "Style Art", icon: "🎨", color: "text-fuchsia-500", bg: "bg-fuchsia-500" }
        };
        const sortedCategoryKeys = Object.keys(categories).sort((a,b) => categories[a].title.localeCompare(categories[b].title));

        let notes = [];
        const STORAGE_KEY = "simple_app_notes";
        let currentFilter = 'all';
        let isGrouped = false; 
        let openNotes = new Set(), openCategories = new Set();
        let currentAttachments = [], currentCarouselImages = {}, currentCarouselCount = 3;
        let noteIdToDelete = null, noteIdToCopy = null, toastTimeout;

        window.onload = () => { initTheme(); populateCategorySelect(); loadNotes(); renderSidebar(); };

        function initTheme() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-moon";
            }
        }
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-moon";
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-sun";
                localStorage.setItem('theme', 'dark');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            t.classList.remove('toast-enter');
            t.classList.add('toast-active');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                t.classList.remove('toast-active');
                t.classList.add('toast-enter');
            }, 3000);
        }

        function toggleSidebar() {
            const s = document.getElementById('sidebar'), o = document.getElementById('sidebar-overlay');
            if (s.classList.contains('-translate-x-full')) {
                s.classList.remove('-translate-x-full'); o.classList.remove('hidden'); setTimeout(() => o.classList.remove('opacity-0'), 10);
            } else {
                s.classList.add('-translate-x-full'); o.classList.add('opacity-0'); setTimeout(() => o.classList.add('hidden'), 300);
            }
        }

        function setFilter(key) { currentFilter = key; renderSidebar(); renderNotes(); if(window.innerWidth < 1024) toggleSidebar(); }

        function renderSidebar() {
            let h = `<button onclick="setFilter('all')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-[10px] transition-colors ${currentFilter === 'all' ? 'bg-ios-blue/10 text-ios-blue font-semibold' : 'text-black dark:text-white hover:bg-gray-200/50 dark:hover:bg-gray-700/50'}"><div class="flex items-center text-[15px]"><i class="fa-solid fa-border-all w-6 text-center mr-2"></i> Semua Catatan</div><span class="text-[13px] text-gray-500">${notes.length}</span></button>`;
            sortedCategoryKeys.forEach(key => {
                const c = notes.filter(n => n.category === key).length;
                h += `<button onclick="setFilter('${key}')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-[10px] mt-1 transition-colors ${currentFilter === key ? 'bg-ios-blue/10 text-ios-blue font-semibold' : 'text-black dark:text-white hover:bg-gray-200/50 dark:hover:bg-gray-700/50'}"><div class="flex items-center text-[15px]"><span class="w-6 text-center mr-2 text-[16px]">${categories[key].icon}</span>${categories[key].title}</div>${c>0 ? `<span class="text-[13px] text-gray-500">${c}</span>` : ''}</button>`;
            });
            document.getElementById('sidebar-categories').innerHTML = h;
        }

        function populateCategorySelect() {
            const sel = document.getElementById('note-category'); sel.innerHTML = '';
            sortedCategoryKeys.forEach(k => {
                const o = document.createElement('option'); o.value = k; o.innerHTML = `${categories[k].icon} ${categories[k].title}`;
                if (k === 'copas') o.selected = true;
                sel.appendChild(o);
            });
        }

        function compressImage(file, cb) {
            const r = new FileReader();
            r.onload = (e) => {
                const img = new Image(); img.onload = () => {
                    const cvs = document.createElement('canvas'), ctx = cvs.getContext('2d');
                    let w = img.width, h = img.height;
                    if (w>h && w>1200) { h*=1200/w; w=1200; } else if (h>1200) { w*=1200/h; h=1200; }
                    cvs.width = w; cvs.height = h; ctx.drawImage(img,0,0,w,h); cb(cvs.toDataURL('image/jpeg', 0.8));
                }; img.src = e.target.result;
            }; r.readAsDataURL(file);
        }

        function handleFileUpload(evt, type) {
            Array.from(evt.target.files).forEach(f => {
                if (type === 'image' && f.size > 2097152) {
                    showToast(`Kompresi ${f.name}...`); compressImage(f, c => { currentAttachments.push({ id: Date.now()+Math.random(), type, name: f.name, data: c }); renderAttachmentPreview(); showToast("Kompresi sukses."); });
                } else if (type !== 'image' && f.size > 2097152) { showToast(`File maks 2MB.`); } 
                else {
                    const r = new FileReader(); r.onload = e => { currentAttachments.push({ id: Date.now()+Math.random(), type, name: f.name, data: e.target.result }); renderAttachmentPreview(); }; r.readAsDataURL(f);
                }
            }); evt.target.value = ''; 
        }

        function removeAttachment(id) { currentAttachments = currentAttachments.filter(a => a.id !== id); renderAttachmentPreview(); }

        function renderAttachmentPreview() {
            document.getElementById('attachment-preview').innerHTML = currentAttachments.map(a => a.type === 'image' ? `<div class="relative w-16 h-16 rounded-[10px] overflow-hidden border border-gray-200 dark:border-gray-700 shrink-0"><img src="${a.data}" class="object-cover w-full h-full"><button onclick="removeAttachment(${a.id})" class="absolute top-1 right-1 bg-black/60 backdrop-blur text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center"><i class="fa-solid fa-times"></i></button></div>` : `<div class="relative ios-input px-3 py-2 text-[13px] flex items-center text-black dark:text-white"><i class="fa-solid fa-file mr-2 text-gray-500"></i><span class="truncate max-w-[120px] mr-5">${a.name}</span><button onclick="removeAttachment(${a.id})" class="absolute right-2 text-gray-400 hover:text-red-500 text-[12px]"><i class="fa-solid fa-times-circle"></i></button></div>`).join('');
        }

        function toggleInputFields() {
            const cat = document.getElementById('note-category').value;
            ['normal','carousel','mypassword','revisi','oneshot'].forEach(id => {
                const el = document.getElementById(id+'-input-container'); if(el) { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            const tg = document.getElementById(cat === 'carousel' || cat === 'mypassword' || cat === 'revisi' || cat === 'oneshot' ? cat+'-input-container' : 'normal-input-container');
            tg.classList.replace('hidden', 'flex');
        }

        // CAROUSEL LOGIC
        function createCarouselInputGroup(id, lbl) {
            return `<div id="car-input-group-${id}" class="relative bg-white dark:bg-ios-darkCard rounded-[14px] p-4 ios-shadow mb-4 border border-ios-separator/10 dark:border-ios-darkSeparator">
                <div class="text-[12px] font-semibold text-ios-blue mb-2 uppercase tracking-wide">${lbl}</div>
                <textarea id="car-content-${id}" placeholder="Konten..." class="w-full bg-transparent text-[16px] text-black dark:text-white focus:outline-none resize-none h-16"></textarea>
                <div class="mt-3 pt-3 border-t border-ios-separator/30 dark:border-ios-darkSeparator flex justify-between items-center">
                    <button onclick="document.getElementById('modal-car-img-${id}').click()" class="text-[14px] text-ios-blue font-medium active:opacity-50"><i class="fa-solid fa-image mr-1"></i> Gambar</button>
                    <input type="file" id="modal-car-img-${id}" accept="image/*" class="hidden" onchange="handleModalCarouselImage(event, '${id}')">
                    <div id="car-img-preview-box-${id}" class="hidden flex items-center space-x-2">
                        <img id="car-img-preview-src-${id}" src="" class="w-8 h-8 object-cover rounded border border-gray-300 dark:border-gray-600">
                        <button onclick="removeModalCarouselImage('${id}')" class="text-ios-red text-[16px] active:opacity-50"><i class="fa-solid fa-circle-xmark"></i></button>
                    </div>
                </div>
            </div>`;
        }

        function initCarouselInputs(count = 3) {
            currentCarouselCount = count; document.getElementById('carousel-count-display').innerText = count;
            const wrap = document.getElementById('carousel-cards-wrapper'); wrap.innerHTML = '';
            for(let i=1; i<=count; i++) wrap.innerHTML += createCarouselInputGroup(i, `Slide ${i}`);
            wrap.innerHTML += createCarouselInputGroup('caption', 'Caption');
        }

        function changeCarouselCount(d) {
            const n = currentCarouselCount + d; if (n<1 || n>20) return;
            const cap = document.getElementById('car-input-group-caption');
            if (d>0) { 
                currentCarouselCount++; 
                cap.insertAdjacentHTML('beforebegin', createCarouselInputGroup(currentCarouselCount, `Slide ${currentCarouselCount}`)); 
            } else { 
                const c = document.getElementById(`car-input-group-${currentCarouselCount}`); 
                if(c) c.remove(); 
                delete currentCarouselImages[currentCarouselCount]; 
                currentCarouselCount--; 
            }
            document.getElementById('carousel-count-display').innerText = currentCarouselCount;
        }

        function handleModalCarouselImage(evt, idx) {
            const f = evt.target.files[0]; if(!f) return;
            if(f.size>2097152){ compressImage(f, c => { currentCarouselImages[idx]=c; renderModalCarouselImagePreview(idx); }); }
            else { const r = new FileReader(); r.onload=e=>{ currentCarouselImages[idx]=e.target.result; renderModalCarouselImagePreview(idx); }; r.readAsDataURL(f); }
        }
        function removeModalCarouselImage(idx) { delete currentCarouselImages[idx]; renderModalCarouselImagePreview(idx); }
        function renderModalCarouselImagePreview(idx) {
            const bx = document.getElementById(`car-img-preview-box-${idx}`), im = document.getElementById(`car-img-preview-src-${idx}`);
            if(currentCarouselImages[idx]){ im.src = currentCarouselImages[idx]; bx.classList.remove('hidden'); } else bx.classList.add('hidden');
        }

        function openModal(editId = null) {
            ['note-id','note-title','note-content','pw-username','pw-password','pw-link','rev-tujuan','rev-content','oneshot-fs-hidden'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = ""; });
            if(document.getElementById('oneshot-fs-visible')) document.getElementById('oneshot-fs-visible').innerText = "";
            const catC = document.getElementById('category-select-container'), catS = document.getElementById('note-category');
            
            if (editId) {
                catC.classList.remove('hidden'); const note = notes.find(n => n.id === editId);
                if(note) {
                    document.getElementById('note-id').value = note.id; document.getElementById('note-title').value = note.title; catS.value = note.category;
                    document.getElementById('modal-title').innerText = "Edit Catatan";
                    currentAttachments = note.attachments ? [...note.attachments] : [];
                    let cCount = 3;
                    if(note.category==='carousel'){
                        let p = []; try{ p=JSON.parse(note.content); }catch(e){}
                        const reg = p.filter(c=>!c.isCaption), cap = p.find(c=>c.isCaption);
                        if(reg.length>0) cCount = reg.length; initCarouselInputs(cCount);
                        for(let i=1;i<=cCount;i++){ if(reg[i-1]){ document.getElementById(`car-content-${i}`).value=reg[i-1].content||''; if(reg[i-1].image){ currentCarouselImages[i]=reg[i-1].image; renderModalCarouselImagePreview(i); } } }
                        if(cap){ document.getElementById('car-content-caption').value=cap.content||''; if(cap.image){ currentCarouselImages['caption']=cap.image; renderModalCarouselImagePreview('caption'); } }
                    } else if(note.category==='mypassword'){
                        let p = {}; try{ p=JSON.parse(note.content); }catch(e){}
                        document.getElementById('pw-username').value=p.username||''; document.getElementById('pw-password').value=p.password||''; document.getElementById('pw-link').value=p.link||''; initCarouselInputs();
                    } else if(note.category==='revisi'){
                        let r = {}; try{ r=JSON.parse(note.content); }catch(e){}
                        document.getElementById('rev-tujuan').value=r.tujuan||''; document.getElementById('rev-content').value=r.content||''; initCarouselInputs();
                    } else if(note.category==='oneshot'){ document.getElementById('oneshot-fs-hidden').value=note.content||''; updateOneShotStats(); initCarouselInputs(); }
                    else { document.getElementById('note-content').value=note.content; initCarouselInputs(); }
                }
            } else {
                document.getElementById('modal-title').innerText = "Buat Catatan";
                currentAttachments=[]; currentCarouselImages={}; initCarouselInputs();
                if(currentFilter!=='all'){ catS.value=currentFilter; catC.classList.add('hidden'); } else { catC.classList.remove('hidden'); }
            }
            renderAttachmentPreview(); toggleInputFields();
            document.getElementById('modal-overlay').classList.remove('hidden'); setTimeout(()=> { document.getElementById('modal-overlay').classList.remove('opacity-0'); document.getElementById('modal').classList.add('modal-active'); }, 10);
        }

        function closeModal() { document.getElementById('modal-overlay').classList.add('opacity-0'); document.getElementById('modal').classList.remove('modal-active'); setTimeout(()=>document.getElementById('modal-overlay').classList.add('hidden'), 400); }

        function openOneShotFullscreen() {
            document.getElementById('oneshot-fullscreen-overlay').classList.remove('hidden'); document.getElementById('oneshot-fullscreen-overlay').classList.add('flex');
            setTimeout(() => { document.getElementById('oneshot-fullscreen-overlay').classList.remove('opacity-0'); placeCaretAtEnd(document.getElementById('oneshot-fs-visible')); }, 10);
        }
        function closeOneShotFullscreen() { document.getElementById('oneshot-fullscreen-overlay').classList.add('opacity-0'); setTimeout(() => { document.getElementById('oneshot-fullscreen-overlay').classList.add('hidden'); document.getElementById('oneshot-fullscreen-overlay').classList.remove('flex'); }, 300); }
        
        function handleOneShotInput(e) {
            const vis = document.getElementById('oneshot-fs-visible'), hid = document.getElementById('oneshot-fs-hidden');
            let txt = vis.innerText;
            
            if (txt.length === 1) {
                const prev = hid.value;
                if (prev === "" || /[.!?]\s+$/.test(prev)) { vis.innerText = txt.toUpperCase(); placeCaretAtEnd(vis); txt = vis.innerText; }
            }

            let val = txt.replace(/\u00A0/g, " ");
            if (val.includes(' ') || val.includes('\n')) {
                const m = val.match(/^(.*[\s\n]+)([^\s\n]*)$/);
                if (m) { hid.value += m[1]; vis.innerText = m[2]; placeCaretAtEnd(vis); }
            }
            updateOneShotStats();
            const box = document.getElementById('oneshot-fs-preview-box');
            if(!box.classList.contains('hidden')) box.innerText = hid.value + vis.innerText;
        }

        function placeCaretAtEnd(el) {
            el.focus(); if (typeof window.getSelection !== "undefined" && typeof document.createRange !== "undefined") {
                const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
                const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
            }
        }
        function updateOneShotStats() {
            const txt = document.getElementById('oneshot-fs-hidden').value + document.getElementById('oneshot-fs-visible').innerText;
            const w = txt.trim() === "" ? 0 : txt.trim().split(/\s+/).length;
            document.getElementById('oneshot-fs-stats').innerText = w + " Kata";
        }
        function toggleOneShotPreview() {
            const box = document.getElementById('oneshot-fs-preview-box'), btnTxt = document.getElementById('oneshot-preview-btn-text');
            if (box.classList.contains('hidden')) { box.classList.remove('hidden'); box.innerText = document.getElementById('oneshot-fs-hidden').value + document.getElementById('oneshot-fs-visible').innerText; btnTxt.innerText = "Tutup Intip"; } 
            else { box.classList.add('hidden'); btnTxt.innerText = "Intip Teks"; placeCaretAtEnd(document.getElementById('oneshot-fs-visible')); }
        }

        function saveNote() {
            const id = document.getElementById('note-id').value, cat = document.getElementById('note-category').value, title = document.getElementById('note-title').value.trim();
            let content = "";
            if (cat === 'carousel') {
                const cards = [];
                for(let i=1;i<=currentCarouselCount;i++){ cards.push({ id: `card-${Date.now()}-${i}`, content: document.getElementById(`car-content-${i}`).value, image: currentCarouselImages[i] || null, isCaption: false }); }
                cards.push({ id: `card-${Date.now()}-cap`, content: document.getElementById('car-content-caption').value, image: currentCarouselImages['caption'] || null, isCaption: true });
                content = JSON.stringify(cards);
            } else if (cat === 'mypassword') {
                content = JSON.stringify({ username: document.getElementById('pw-username').value, password: document.getElementById('pw-password').value, link: document.getElementById('pw-link').value });
            } else if (cat === 'revisi') {
                content = JSON.stringify({ tujuan: document.getElementById('rev-tujuan').value, content: document.getElementById('rev-content').value });
            } else if (cat === 'oneshot') { content = document.getElementById('oneshot-fs-hidden').value + document.getElementById('oneshot-fs-visible').innerText; } 
            else { content = document.getElementById('note-content').value; }

            if (!content.trim() && cat !== 'carousel' && cat !== 'mypassword' && cat !== 'revisi' && currentAttachments.length===0 && !title) return;

            if (id) { const i = notes.findIndex(n => n.id === id); if(i!==-1) notes[i] = { ...notes[i], category: cat, title, content, attachments: [...currentAttachments], updatedAt: new Date().toISOString() }; } 
            else { notes.unshift({ id: Date.now().toString(), category: cat, title, content, attachments: [...currentAttachments], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }); }
            
            saveToStorage(); renderSidebar(); renderNotes(); closeModal(); showToast("Tersimpan!");
        }

        function loadNotes() { const s = localStorage.getItem(STORAGE_KEY); if(s) notes = JSON.parse(s); renderNotes(); }
        function saveToStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }

        function toggleGroupView() { isGrouped = !isGrouped; document.getElementById('btn-group').classList.toggle('opacity-50'); renderNotes(); }
        function toggleAccordion(id) { const c = document.getElementById(`acc-content-${id}`), i = document.getElementById(`acc-icon-${id}`); if(openNotes.has(id)){ openNotes.delete(id); c.classList.remove('open'); i.classList.remove('open'); } else { openNotes.add(id); c.classList.add('open'); i.classList.add('open'); } }
        function toggleCategoryGroup(cat) { const c = document.getElementById(`cat-content-${cat}`), i = document.getElementById(`cat-icon-${cat}`); if(openCategories.has(cat)){ openCategories.delete(cat); c.classList.add('hidden'); i.style.transform = 'rotate(0deg)'; } else { openCategories.add(cat); c.classList.remove('hidden'); i.style.transform = 'rotate(180deg)'; } }

        function formatDate(ds) { const d=new Date(ds), now=new Date(), diff=(now-d)/1000; if(diff<86400) return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); if(diff<604800) return ['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()]; return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'}); }

        function openCopyModal(id) { noteIdToCopy = id; document.getElementById('copy-modal-overlay').classList.remove('hidden'); setTimeout(()=>document.getElementById('copy-modal-overlay').classList.remove('opacity-0'),10); }
        function closeCopyModal() { document.getElementById('copy-modal-overlay').classList.add('opacity-0'); setTimeout(()=>document.getElementById('copy-modal-overlay').classList.add('hidden'),300); }
        
        function executeCopy(withTitle) {
            const n = notes.find(x => x.id === noteIdToCopy); if(!n) return;
            let txt = (withTitle && n.title) ? n.title + "\n\n" : "";
            if (n.category === 'carousel') {
                try { const p = JSON.parse(n.content); p.forEach((c,i)=>{ if(c.isCaption) txt+=`\n[CAPTION]\n${c.content}\n`; else txt+=`[Slide ${i+1}]\n${c.content}\n\n`; }); } catch(e){}
            } else if(n.category === 'mypassword') {
                try { const p=JSON.parse(n.content); txt+=`Username: ${p.username}\nPassword: ${p.password}\nLink: ${p.link}`; } catch(e){}
            } else if(n.category === 'revisi') {
                try { const r=JSON.parse(n.content); txt+=`Tujuan: ${r.tujuan}\nRevisi:\n${r.content}`; } catch(e){}
            } else { txt += n.content; }
            navigator.clipboard.writeText(txt.trim()).then(() => { closeCopyModal(); showToast("Teks disalin"); });
        }

        function openDeleteAlert(id) { noteIdToDelete = id; document.getElementById('delete-alert-overlay').classList.remove('hidden'); setTimeout(()=>document.getElementById('delete-alert-overlay').classList.remove('opacity-0'),10); }
        function closeDeleteAlert() { document.getElementById('delete-alert-overlay').classList.add('opacity-0'); setTimeout(()=>document.getElementById('delete-alert-overlay').classList.add('hidden'),300); }
        function confirmDelete() { if(noteIdToDelete){ notes = notes.filter(n=>n.id!==noteIdToDelete); saveToStorage(); renderSidebar(); renderNotes(); closeDeleteAlert(); showToast("Catatan dihapus"); } }

        function renderNotes() {
            const cont = document.getElementById('notes-container'); cont.innerHTML = '';
            let f = notes; if(currentFilter!=='all') f = notes.filter(n=>n.category===currentFilter);
            if(f.length===0){ cont.innerHTML = `<div class="flex flex-col items-center justify-center h-[50vh] text-gray-400"><i class="fa-solid fa-folder-open text-6xl mb-4 opacity-40"></i><p class="text-[17px]">Belum ada catatan.</p></div>`; return; }

            if (isGrouped) {
                const cats = [...new Set(f.map(n=>n.category))].sort();
                cats.forEach(c => {
                    const cNotes = f.filter(n=>n.category===c); const conf = categories[c]; if(!openCategories.has(c)) openCategories.add(c);
                    
                    // KARTU KATEGORI UTAMA (OUTER CARD)
                    let h = `<div class="mb-6 bg-white dark:bg-ios-darkCard rounded-[28px] ios-shadow p-5 lg:p-6 border border-ios-separator/10 dark:border-ios-darkSeparator">
                        <div class="flex items-center justify-between cursor-pointer active:opacity-50 pb-2" onclick="toggleCategoryGroup('${c}')">
                            <div class="flex items-center">
                                <span class="w-10 h-10 ${conf.bg} text-white rounded-full flex items-center justify-center mr-4 ios-shadow"><span class="text-[18px]">${conf.icon}</span></span>
                                <h3 class="font-bold text-[22px] text-black dark:text-white tracking-tight">${conf.title}</h3>
                            </div>
                            <div class="flex items-center">
                                <span class="text-[14px] font-semibold text-gray-500 bg-gray-100 dark:bg-[#2C2C2E] px-3 py-1 rounded-full mr-3">${cNotes.length}</span>
                                <i id="cat-icon-${c}" class="fa-solid fa-chevron-down text-gray-400 transition-transform ${openCategories.has(c)?'rotate-180':''}"></i>
                            </div>
                        </div>
                        <div id="cat-content-${c}" class="${openCategories.has(c)?'':'hidden'} pt-5 mt-3 border-t border-ios-separator/20 dark:border-ios-darkSeparator columns-1 md:columns-2 lg:columns-3 gap-4 space-y-4">`;
                    
                    // NESTED CARDS
                    cNotes.forEach(n => h += `<div class="break-inside-avoid">${buildNoteCard(n, true)}</div>`);
                    h += `</div></div>`; cont.innerHTML += h;
                });
            } else {
                let h = `<div class="columns-1 md:columns-2 lg:columns-3 gap-4 space-y-4">`;
                f.forEach(n => h += `<div class="break-inside-avoid">${buildNoteCard(n, false)}</div>`);
                h += `</div>`; cont.innerHTML = h;
            }
        }

        // PARAMETER TAMBAHAN `isNested` UNTUK MENYESUAIKAN STYLING
        function buildNoteCard(note, isNested = false) {
            const conf = categories[note.category] || categories.copas;
            
            // JIKA NESTED, UBAH LATAR BELAKANG AGAR TERLIHAT "KARTU DALAM KARTU"
            const bgWrapper = isNested 
                ? 'bg-gray-50/70 dark:bg-[#2C2C2E]/60 border border-ios-separator/20 dark:border-ios-darkSeparator' 
                : 'bg-ios-card dark:bg-ios-darkCard ios-shadow border border-ios-separator/10 dark:border-ios-darkSeparator';

            let imgHtml = '', fileHtml = '';
            if(note.attachments && note.attachments.length>0){
                const imgs = note.attachments.filter(a=>a.type==='image'), fls = note.attachments.filter(a=>a.type!=='image');
                if(imgs.length>0) imgHtml = `<div class="w-full flex flex-col gap-1 mb-3">` + imgs.map(i=>`<img src="${i.data}" class="w-full h-auto max-h-[300px] object-cover rounded-[12px] border border-ios-separator/10 dark:border-ios-darkSeparator">`).join('') + `</div>`;
                if(fls.length>0) fileHtml = `<div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-ios-separator/20 dark:border-ios-darkSeparator">` + fls.map(f=>`<div class="bg-gray-200/50 dark:bg-[#3A3A3C]/50 px-3 py-1.5 rounded-[8px] text-[13px] flex items-center text-black dark:text-white"><i class="fa-solid fa-file mr-2 text-gray-500"></i> <span class="truncate max-w-[120px]">${f.name}</span></div>`).join('') + `</div>`;
            }

            let cHtml = '';
            if (note.category === 'carousel') {
                try {
                    const p = JSON.parse(note.content), reg=p.filter(c=>!c.isCaption), cap=p.find(c=>c.isCaption);
                    if(reg.length>0) cHtml += `<div class="flex overflow-x-auto space-x-3 pb-2 hide-scrollbar">` + reg.map((c,i)=>`<div class="shrink-0 w-[220px] bg-white dark:bg-[#1C1C1E] border border-ios-separator/10 dark:border-ios-darkSeparator rounded-[14px] overflow-hidden flex flex-col shadow-sm"><div class="bg-gray-200 dark:bg-[#3A3A3C] px-3 py-1.5 text-[11px] font-semibold text-gray-700 dark:text-gray-300">Slide ${i+1}</div>${c.image?`<img src="${c.image}" class="w-full h-24 object-cover">`:''}<div class="p-3 text-[15px] text-black dark:text-white whitespace-pre-wrap">${c.content}</div></div>`).join('') + `</div>`;
                    if(cap) cHtml += `<div class="mt-3 bg-ios-blue/10 border border-ios-blue/20 rounded-[14px] overflow-hidden shadow-sm"><div class="bg-ios-blue/20 px-3 py-1.5 text-[11px] font-bold text-ios-blue">Caption</div>${cap.image?`<img src="${cap.image}" class="w-full h-32 object-cover">`:''}<div class="p-3 text-[15px] text-black dark:text-white whitespace-pre-wrap">${cap.content}</div></div>`;
                } catch(e) { cHtml = note.content; }
            } else if (note.category === 'mypassword') {
                try {
                    const p = JSON.parse(note.content);
                    cHtml = `<div class="space-y-2"><div class="flex items-center text-[15px]"><span class="w-8 text-center text-gray-400"><i class="fa-solid fa-user"></i></span><span class="font-medium text-black dark:text-white bg-white dark:bg-[#3A3A3C] shadow-sm px-2 py-1 rounded-[8px]">${p.username||'-'}</span></div><div class="flex items-center text-[15px]"><span class="w-8 text-center text-gray-400"><i class="fa-solid fa-key"></i></span><span class="font-medium text-black dark:text-white bg-white dark:bg-[#3A3A3C] shadow-sm px-2 py-1 rounded-[8px] blur-sm hover:blur-none transition-all">${p.password||'-'}</span></div>${p.link?`<div class="flex items-center text-[15px] mt-2"><span class="w-8 text-center text-gray-400"><i class="fa-solid fa-link"></i></span><a href="${p.link}" target="_blank" class="text-ios-blue hover:opacity-70 truncate">${p.link}</a></div>`:''}</div>`;
                } catch(e) { cHtml = note.content; }
            } else if (note.category === 'revisi') {
                try { const r = JSON.parse(note.content); cHtml = `<div class="bg-white dark:bg-[#3A3A3C] shadow-sm border border-ios-separator/10 dark:border-ios-darkSeparator p-3 rounded-[12px] mb-3"><div class="text-[12px] font-semibold text-gray-500 mb-1">Tujuan:</div><div class="font-medium text-black dark:text-white text-[15px]">${r.tujuan}</div></div><div class="text-[16px] text-black dark:text-white whitespace-pre-wrap leading-relaxed">${r.content}</div>`; } catch(e) { cHtml = note.content; }
            } else {
                let lines = note.content ? note.content.split('\n') : [];
                let pText = lines.slice(0, 3).join('\n');
                let isLong = lines.length > 3 || note.content.length > 200;
                if(isLong && lines.length <= 3) pText = note.content.substring(0,200) + '...';
                
                if (isLong) {
                    cHtml = `<div class="accordion-content ${openNotes.has(note.id)?'open':''}" id="acc-content-${note.id}"><div class="accordion-inner"><div class="text-[16px] leading-relaxed text-black dark:text-white whitespace-pre-wrap pb-2">${note.content}</div></div></div><div class="${openNotes.has(note.id)?'hidden':''} text-[16px] leading-relaxed text-black dark:text-white whitespace-pre-wrap relative">${pText}<div class="absolute bottom-0 w-full h-8 bg-gradient-to-t ${isNested ? 'from-gray-50 dark:from-[#2C2C2E]' : 'from-ios-card dark:from-ios-darkCard'} to-transparent"></div></div><button onclick="toggleAccordion('${note.id}')" class="text-[15px] font-medium text-ios-blue mt-1 flex items-center active:opacity-50">Selengkapnya <i id="acc-icon-${note.id}" class="fa-solid fa-chevron-down ml-1 text-[12px] chevron-icon ${openNotes.has(note.id)?'open':''}"></i></button>`;
                } else { cHtml = `<div class="text-[16px] leading-relaxed text-black dark:text-white whitespace-pre-wrap">${note.content}</div>`; }
            }

            return `<div class="${bgWrapper} rounded-[24px] p-5 relative overflow-hidden group">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center space-x-3">
                        <span class="w-8 h-8 rounded-full ${conf.bg} text-white flex items-center justify-center text-[14px] shadow-sm">${conf.icon}</span>
                        <div>${note.title?`<h4 class="font-semibold text-black dark:text-white text-[17px] leading-tight">${note.title}</h4>`:''}<p class="text-[12px] text-gray-500">${formatDate(note.createdAt)}</p></div>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="openCopyModal('${note.id}')" class="w-8 h-8 text-gray-400 hover:text-green-500 bg-white/50 dark:bg-[#3A3A3C]/50 rounded-full flex items-center justify-center transition-colors active:scale-95"><i class="fa-regular fa-copy text-[14px]"></i></button>
                        <button onclick="openModal('${note.id}')" class="w-8 h-8 text-gray-400 hover:text-ios-blue bg-white/50 dark:bg-[#3A3A3C]/50 rounded-full flex items-center justify-center transition-colors active:scale-95"><i class="fa-solid fa-pen-to-square text-[14px]"></i></button>
                        <button onclick="openDeleteAlert('${note.id}')" class="w-8 h-8 text-gray-400 hover:text-ios-red bg-white/50 dark:bg-[#3A3A3C]/50 rounded-full flex items-center justify-center transition-colors active:scale-95"><i class="fa-solid fa-trash-can text-[14px]"></i></button>
                    </div>
                </div>
                ${imgHtml}
                ${cHtml}
                ${fileHtml}
            </div>`;
        }
    </script>
</body>
</html>
